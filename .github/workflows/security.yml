name: Security analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: ShellCheck
        run: shellcheck install.sh installer/preflight.sh
      - name: Bandit
        run: |
          python -m pip install bandit==1.9.4
          bandit -r src -f json -o bandit.json || test "$?" -eq 1
          python tests/check_bandit.py bandit.json
      - name: Preserve Bandit findings
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bandit-findings
          path: bandit.json
          if-no-files-found: ignore
          retention-days: 7

  codeql:
    name: CodeQL Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.2
      - name: Scan repository history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --exit-code 1 .

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Zizmor
        run: |
          python3 -m pip install zizmor==1.21.0
          zizmor .github/workflows
