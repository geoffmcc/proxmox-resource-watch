name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python regressions
        run: python -m unittest discover -s tests -v
      - name: Direct regression invocation
        run: python tests/test_resource_watch.py -v
      - name: Realistic offline report budget
        run: python tests/benchmark_report.py
      - name: Thirty-day history budget
        run: python tests/benchmark_history.py
      - name: New direct regression invocation
        run: python tests/test_guest_history_daily.py -v
      - name: Pre-PR failure-path regressions
        run: python tests/test_review_fixes.py -v
      - name: Python syntax
        run: python -m py_compile src/*.py tests/*.py
      - name: Installer shell syntax
        run: bash -n install.sh installer/preflight.sh
      - name: Systemd unit syntax
        run: systemd-analyze verify systemd/*.service systemd/*.timer
